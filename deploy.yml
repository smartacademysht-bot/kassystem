name: Deploy with Secrets

on:
  push:
    branches:
      - main  # Change this to your default branch name if different (e.g. master)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: smartacademysht-bot
        uses: actions/checkout@v4

      # Replace placeholders with GitHub Repository Secrets inside index.html
      - name: Inject Secrets into index.html
        run: |
          sed -i 's|__SUPABASE_URL__|'"${{ secrets.SUPABASE_URL }}"'|g' index.html
          sed -i 's|__SUPABASE_ANON_KEY__|'"${{ secrets.SUPABASE_ANON_KEY }}"'|g' index.html
          sed -i 's|__OPENROUTER_API_KEY__|'"${{ secrets.OPENROUTER_API_KEY }}"'|g' index.html
          sed -i 's|__GH_TOKEN__|'"${{ secrets.GH_TOKEN }}"'|g' index.html

      # Setup and deploy to GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
